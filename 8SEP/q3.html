<!DOCTYPE html>
<html>
<head>
    <title>ROWSPAN TABLE</title>
</head>
<body>

<table border="1">

    <tr>
        <th>Name</th>
        <th>Course</th>
        <th>Marks</th>
    </tr>

    <tr>
        <td rowspan="2">Ali</td>
        <td>BCA</td>
        <td>85</td>
    </tr>

    <tr>
        <td>BCA</td>
        <td>90</td>
    </tr>

</table>

</body>
</html>
